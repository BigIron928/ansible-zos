- name: Submit resolved JCL to z/OS
  hosts: zoslab
  gather_facts: false
  environment: "{{ environment_vars }}"
  vars:
    job_owner: "{{ owner | default('IBMUSER') }}" 
    hlq: "{{ userid }}"
    jcl_path: "{{ playbook_dir }}/tmp_jcl/rendered.jcl"

    libraries:
      - mlq: COBOL
        libname: SOURCE
        primary_allocation: 2
        secondary_allocation: 4
      - mlq: COBOL
        libname: COPYLIB
        primary_allocation: 2
        secondary_allocation: 4
      - mlq: REXX
        libname: SCRIPTS
        primary_allocation: 2
        secondary_allocation: 4
      - mlq: QMF
        libname: SCRIPTS
        primary_allocation: 2
        secondary_allocation: 4
      - mlq: DEV
        libname: PROGLIB
        primary_allocation: 2
        secondary_allocation: 4

  tasks:

    - ansible.builtin.assert:
        that: hlq is defined
        fail_msg: 'The z/OS userid must be passed on command line: ansible-playbook blah -e "userid=value"'

    - name: Submit one job per library
      ansible.builtin.include_role:
        name: zos_nuser_datasets
      vars:
        library: "{{ item }}"
      loop: "{{ libraries }}"
      loop_control:
        label: "{{ hlq }}.{{ item.mlq }}.{{ item.libname }}"
